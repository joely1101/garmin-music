name: Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller yt-dlp mutagen feedparser uvicorn fastapi pydantic

      - name: Download FFmpeg Binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path bin
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted" -Force
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          Copy-Item -Path $ffmpegExe.FullName -Destination "bin\ffmpeg.exe" -Force
          Copy-Item -Path $ffprobeExe.FullName -Destination "bin\ffprobe.exe" -Force
          Remove-Item -Path "ffmpeg.zip", "ffmpeg_extracted" -Recurse -Force

      - name: Build Executable with PyInstaller
        shell: powershell
        run: |
          pyinstaller --clean GarminMusicStudio.spec

      - name: Package Release ZIP
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release_pkg\music
          New-Item -ItemType Directory -Force -Path release_pkg\data
          Copy-Item -Path "dist\GarminMusicStudio.exe" -Destination "release_pkg\GarminMusicStudio.exe"
          Compress-Archive -Path "release_pkg\*" -DestinationPath "GarminMusicStudio-Windows-x64.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GarminMusicStudio-Windows-x64
          path: GarminMusicStudio-Windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GarminMusicStudio-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
