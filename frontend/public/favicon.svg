<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="garmin_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <!-- 上錶帶 (具備運動透氣紋理) -->
  <path d="M44 4 L76 4 L74 24 L46 24 Z" fill="#334155" rx="3"/>
  <rect x="52" y="8" width="16" height="3" rx="1.5" fill="#1e293b"/>
  <rect x="53" y="14" width="14" height="3" rx="1.5" fill="#1e293b"/>

  <!-- 下錶帶 -->
  <path d="M46 96 L74 96 L76 116 L44 116 Z" fill="#334155" rx="3"/>
  <rect x="53" y="102" width="14" height="3" rx="1.5" fill="#1e293b"/>
  <rect x="52" y="108" width="16" height="3" rx="1.5" fill="#1e293b"/>

  <!-- 手錶實體按鍵 (Garmin 經典側邊按鍵) -->
  <rect x="19" y="44" width="4" height="10" rx="2" fill="#94a3b8"/>
  <rect x="97" y="38" width="4" height="10" rx="2" fill="#f43f5e"/> <!-- 啟動運動紅鍵 -->
  <rect x="97" y="68" width="4" height="10" rx="2" fill="#94a3b8"/> <!-- Back 鍵 -->

  <!-- 手錶金屬錶殼與外圈 -->
  <circle cx="60" cy="60" r="38" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  <!-- 內錶圈刻度圓 (Bezel) -->
  <circle cx="60" cy="60" r="32" fill="url(#garmin_grad)"/>

  <!-- 音符主體 (白色雙音符) -->
  <ellipse cx="48" cy="70" rx="6.5" ry="5" fill="#ffffff" transform="rotate(-18 48 70)"/>
  <ellipse cx="71" cy="63" rx="6.5" ry="5" fill="#ffffff" transform="rotate(-18 71 63)"/>
  <rect x="53" y="43" width="4.5" height="28" fill="#ffffff"/>
  <rect x="76" y="36" width="4.5" height="28" fill="#ffffff"/>
  <polygon points="53,43 80.5,36 80.5,43 53,50" fill="#ffffff"/>
</svg>
