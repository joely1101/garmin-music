<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- 手錶外框錶帶 (上方與下方) -->
  <rect x="36" y="8" width="28" height="18" rx="5" fill="#ffffff" opacity="0.85" />
  <rect x="36" y="74" width="28" height="18" rx="5" fill="#ffffff" opacity="0.85" />

  <!-- 手錶圓形錶盤本體 -->
  <circle cx="50" cy="50" r="32" fill="url(#bgGrad)" stroke="#ffffff" stroke-width="4.5" />

  <!-- 錶盤內部的音樂音符 (手錶結合音符) -->
  <!-- 左音符圈 -->
  <ellipse cx="40" cy="59" rx="5.5" ry="4" fill="#ffffff" transform="rotate(-15 40 59)" />
  <!-- 右音符圈 -->
  <ellipse cx="58" cy="53" rx="5.5" ry="4" fill="#ffffff" transform="rotate(-15 58 53)" />
  <!-- 左符桿 -->
  <rect x="43" y="38" width="3.5" height="21" fill="#ffffff" />
  <!-- 右符桿 -->
  <rect x="61" y="32" width="3.5" height="21" fill="#ffffff" />
  <!-- 上方連接符槓 -->
  <polygon points="43,38 64.5,32 64.5,36.5 43,42.5" fill="#ffffff" />
</svg>
