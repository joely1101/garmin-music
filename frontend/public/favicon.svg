<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="opt3_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <!-- 上錶帶 (淺色搭配白色手錶) -->
  <rect x="43" y="3" width="34" height="24" rx="4" fill="#334155"/>
  <rect x="47" y="7" width="26" height="5" rx="2" fill="#e2e8f0"/> <!-- 金屬固定環 -->

  <!-- 下錶帶 (含手錶穿孔) -->
  <rect x="43" y="93" width="34" height="24" rx="4" fill="#334155"/>
  <circle cx="60" cy="100" r="2.5" fill="#1e293b"/>
  <circle cx="60" cy="107" r="2.5" fill="#1e293b"/>
  <circle cx="60" cy="114" r="2.5" fill="#1e293b"/>

  <!-- 手錶機身側邊 4 顆按鍵 (白色/精鋼) -->
  <rect x="17" y="42" width="5" height="9" rx="2" fill="#cbd5e1"/>
  <rect x="17" y="68" width="5" height="9" rx="2" fill="#cbd5e1"/>
  <rect x="98" y="42" width="5" height="9" rx="2" fill="#f43f5e"/> <!-- 運動紅鍵 -->
  <rect x="98" y="68" width="5" height="9" rx="2" fill="#cbd5e1"/>

  <!-- 手錶外框改成亮白質感 (白色外框 + 白色按鍵裝飾) -->
  <circle cx="60" cy="60" r="40" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="60" cy="60" r="33" fill="#0f172a"/>
  <circle cx="60" cy="60" r="29" fill="url(#opt3_bg)"/>

  <!-- 音符主體 (收攏在內圓 r=29 之中，絕不跑出外框) -->
  <!-- 左符頭 -->
  <ellipse cx="49" cy="69" rx="6.5" ry="4.8" fill="#ffffff" transform="rotate(-18 49 69)"/>
  <!-- 右符頭 -->
  <ellipse cx="71" cy="63" rx="6.5" ry="4.8" fill="#ffffff" transform="rotate(-18 71 63)"/>
  <!-- 左符桿 -->
  <rect x="53.5" y="44" width="4.5" height="25" fill="#ffffff"/>
  <!-- 右符桿 -->
  <rect x="75.5" y="38" width="4.5" height="25" fill="#ffffff"/>
  <!-- 上方連梁橫槓 -->
  <polygon points="53.5,44 80,38 80,44.5 53.5,50.5" fill="#ffffff"/>
</svg>
